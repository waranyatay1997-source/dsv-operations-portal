  &lt;script&gt;
    const $ = (id) =&gt; document.getElementById(id);
    const fixedHeader = &#x27;DSV · Shipping Mark&#x27;;
    const defaultRows = 30;

    function escapeHtml(val) {
      return String(val ?? &#x27;&#x27;)
        .replaceAll(&#x27;&amp;&#x27;, &#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;, &#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;, &#x27;&amp;gt;&#x27;)
        .replaceAll(&#x27;&quot;&#x27;, &#x27;&amp;quot;&#x27;).replaceAll(&quot;&#x27;&quot;, &#x27;&amp;#39;&#x27;);
    }

    function bindGridEvents() {
      $(&#x27;gridBody&#x27;).querySelectorAll(&#x27;.data-cell&#x27;).forEach((cell) =&gt; {
        cell.addEventListener(&#x27;paste&#x27;, handlePaste);
      });
    }

    function getCellPosition(cell) {
      return {
        row: cell.parentElement.rowIndex - 1,
        col: parseInt(cell.dataset.col || &#x27;1&#x27;, 10)
      };
    }

    function normalizeClipboard(text) {
      const lines = text.replace(/\r/g, &#x27;&#x27;).split(&#x27;\n&#x27;).filter(line =&gt; line.length &gt; 0);
      return lines.map(line =&gt; line.split(&#x27;\t&#x27;));
    }

    function handlePaste(e) {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData(&#x27;text&#x27;);
      const matrix = normalizeClipboard(text);
      if (!matrix.length) return;

      const start = getCellPosition(e.currentTarget);
      const rows = Array.from($(&#x27;gridBody&#x27;).children);

      matrix.forEach((line, rIdx) =&gt; {
        const targetRowIndex = start.row + rIdx;
        if (targetRowIndex &gt;= defaultRows) return;
        const cells = rows[targetRowIndex].querySelectorAll(&#x27;.data-cell&#x27;);
        for (let cIdx = 0; cIdx &lt; 3; cIdx++) {
          const targetCol = start.col + cIdx;
          if (targetCol &gt; 3) break;
          cells[targetCol - 1].textContent = (line[cIdx] ?? &#x27;&#x27;).trim();
        }
      });
    }

    function clearTable() {
      $(&#x27;gridBody&#x27;).querySelectorAll(&#x27;.data-cell&#x27;).forEach((cell) =&gt; { cell.textContent = &#x27;&#x27;; });
      $(&#x27;pages&#x27;).innerHTML = &#x27;&#x27;;
      $(&#x27;summaryText&#x27;).textContent = &#x27;ยังไม่ได้ generate&#x27;;
    }

    function readRows() {
      const rows = [];
      Array.from($(&#x27;gridBody&#x27;).children).forEach((tr) =&gt; {
        const cells = tr.querySelectorAll(&#x27;.data-cell&#x27;);
        const hbl = cells[0]?.textContent.trim() || &#x27;&#x27;;
        const sid = cells[1]?.textContent.trim() || &#x27;&#x27;;
        const qtyText = cells[2]?.textContent.trim() || &#x27;&#x27;;
        const qty = parseInt(qtyText, 10) || 0;
        if (hbl || sid || qtyText) rows.push({ hbl, sid, qty });
      });
      return rows;
    }

    function validateRows(rows) {
      if (!rows.length) return { ok: false };
      for (const row of rows) {
        if (!row.hbl || !row.sid || !Number.isFinite(Number(row.qty)) || Number(row.qty) &lt;= 0) {
          return { ok: false };
        }
      }
      return { ok: true };
    }

    function createLabel(row, index) {
      return `&lt;section class=&quot;label&quot;&gt;&lt;div class=&quot;label-stack&quot;&gt;&lt;div class=&quot;label-top&quot;&gt;&lt;div class=&quot;label-header&quot;&gt;${escapeHtml(fixedHeader)}&lt;/div&gt;&lt;div class=&quot;label-title&quot;&gt;Shipment Number / Shipping Mark :&lt;/div&gt;&lt;div class=&quot;label-value sid&quot;&gt;${escapeHtml(row.sid)}&lt;/div&gt;&lt;div class=&quot;label-title hbl-title&quot;&gt;House Bill Of Lading :&lt;/div&gt;&lt;div class=&quot;label-value hbl&quot;&gt;${escapeHtml(row.hbl)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;label-counter&quot;&gt;&lt;span class=&quot;counter-num&quot;&gt;${index}&lt;/span&gt;&lt;span class=&quot;counter-of&quot;&gt;OF&lt;/span&gt;&lt;span class=&quot;counter-num&quot;&gt;${row.qty}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`;
    }

    function generateLabels() {
      const rows = readRows();
      const check = validateRows(rows);
      if (!check.ok) {
        $(&#x27;pages&#x27;).innerHTML = &#x27;&#x27;;
        $(&#x27;summaryText&#x27;).textContent = &#x27;ยังไม่ได้ generate&#x27;;
        return;
      }
      const labels = [];
      rows.forEach((row) =&gt; {
        for (let i = 1; i &lt;= row.qty; i++) labels.push(createLabel(row, i));
      });
      const pages = [];
      for (let i = 0; i &lt; labels.length; i += 2) {
        pages.push(`&lt;div class=&quot;page&quot;&gt;${labels[i] || &#x27;&lt;section class=&quot;label&quot;&gt;&lt;/section&gt;&#x27;}${labels[i + 1] || &#x27;&lt;section class=&quot;label&quot;&gt;&lt;/section&gt;&#x27;}&lt;/div&gt;`);
      }
      $(&#x27;pages&#x27;).innerHTML = pages.join(&#x27;&#x27;);
      $(&#x27;summaryText&#x27;).textContent = `ข้อมูล ${rows.length} แถว · label ${labels.length} ป้าย · ${pages.length} หน้า`;
    }

    function printLabels() {
      generateLabels();
      const previousTitle = document.title;
      document.title = &#x27;Shipping mark T.&#x27;;
      setTimeout(() =&gt; {
        window.print();
        setTimeout(() =&gt; { document.title = previousTitle; }, 800);
      }, 100);
    }

    $(&#x27;btnClear&#x27;).addEventListener(&#x27;click&#x27;, clearTable);
    $(&#x27;btnGenerateTop&#x27;).addEventListener(&#x27;click&#x27;, generateLabels);
    $(&#x27;btnPrintTop&#x27;).addEventListener(&#x27;click&#x27;, printLabels);

    bindGridEvents();
  &lt;/script&gt;

&lt;script&gt;

let files = [];

const dropZone = document.getElementById(&#x27;drop-zone&#x27;);

const fileList = document.getElementById(&#x27;file-list&#x27;);

dropZone.addEventListener(&#x27;dragover&#x27;, e =&gt; { e.preventDefault(); dropZone.classList.add(&#x27;drag-over&#x27;); });
dropZone.addEventListener(&#x27;dragleave&#x27;, () =&gt; dropZone.classList.remove(&#x27;drag-over&#x27;));
dropZone.addEventListener(&#x27;drop&#x27;, e =&gt; {
  e.preventDefault();
  dropZone.classList.remove(&#x27;drag-over&#x27;);
  addFiles([...e.dataTransfer.files].filter(f =&gt; f.type === &#x27;application/pdf&#x27;));
});
fileInput.addEventListener(&#x27;change&#x27;, e =&gt; { addFiles([...e.target.files]); fileInput.value = &#x27;&#x27;; });

function addFiles(newFiles) {
  newFiles.forEach(f =&gt; { if (!files.find(x =&gt; x.name === f.name)) files.push(f); });
  renderFileList();
}

function renderFileList() {
  fileList.innerHTML = &#x27;&#x27;;
  files.forEach((f, i) =&gt; {
    const tag = document.createElement(&#x27;span&#x27;);
    tag.className = &#x27;file-tag&#x27;;
    tag.innerHTML = `📄 ${f.name} &lt;span class=&quot;remove-btn&quot; onclick=&quot;removeFile(${i})&quot;&gt;✕&lt;/span&gt;`;
    fileList.appendChild(tag);
  });
  extractBtn.disabled = files.length === 0;
  if (files.length === 0) {
    document.getElementById(&#x27;results-section&#x27;).style.display = &#x27;none&#x27;;
    exportBtn.disabled = true;
    results = [];
  }
}

function removeFile(i) { files.splice(i, 1); renderFileList(); }

function clearAll() {
  files = []; results = [];
  renderFileList();
  status.textContent = &#x27;&#x27;;
  document.getElementById(&#x27;results-section&#x27;).style.display = &#x27;none&#x27;;
  exportBtn.disabled = true;
}

async function extractItemsFromPDF(file) {
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
  const allItems = [];
  let yOffset = 0;
  for (let pageNum = 1; pageNum &lt;= pdf.numPages; pageNum++) {
    const page = await pdf.getPage(pageNum);
    const content = await page.getTextContent();
    const viewport = page.getViewport({ scale: 1 });
    const pageH = viewport.height;
    content.items.forEach(item =&gt; {
      if (!item.str.trim()) return;
      const x = item.transform[4];
      const y = pageH - item.transform[5];
      allItems.push({ str: item.str.trim(), x, y: y + yOffset, page: pageNum });
    });
    yOffset += pageH;
  }
  return allItems;
}

function normalizeSpaces(text) {
  return String(text || &#x27;&#x27;).replace(/\s+/g, &#x27; &#x27;).trim();
}

function groupItemsIntoLines(items, yTolerance = 3) {
  const sorted = [...items].sort((a, b) =&gt; a.y - b.y || a.x - b.x);
  const lines = [];
  sorted.forEach(item =&gt; {
    const last = lines[lines.length - 1];
    if (!last || Math.abs(item.y - last.y) &gt; yTolerance) {
      lines.push({ y: item.y, items: [item] });
    } else {
      last.items.push(item);
    }

  return lines.map(line =&gt; ({
    y: line.y,
    text: normalizeSpaces(line.items.sort((a, b) =&gt; a.x - b.x).map(it =&gt; it.str).join(&#x27; &#x27;))
  }));
}

function extractShipmentNumbers(items) {
  const shipmentPattern = /\b\d{8}-\d{5}\b/g;
  const seen = new Map();
  items.forEach(item =&gt; {
    const matches = item.str.match(shipmentPattern);
    if (!matches) return;
    matches.forEach(num =&gt; {
      if (!seen.has(num) || item.y &lt; seen.get(num)) seen.set(num, item.y);
    });
  });
  return [...seen.entries()].map(([num, y]) =&gt; ({ num, y })).sort((a, b) =&gt; a.y - b.y);
}

function cleanToken(token) {
  return token.replace(/^[^A-Z0-9]+/i, &#x27;&#x27;).replace(/[^A-Z0-9-]+$/i, &#x27;&#x27;).trim();
}

function isDateLike(token) {
  const t = cleanToken(token).toUpperCase();
  return /^\d{1,2}-[A-Z]{3}-\d{2,4}$/.test(t)
    || /^\d{1,2}\/[A-Z]{3}\/\d{2,4}$/.test(t)
    || /^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}$/.test(t)
    || /^(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)-\d{2,4}$/.test(t);
}

function isLikelyPalletCode(token) {
  const t = cleanToken(token);
  if (!t || t.length &lt; 5 || t.length &gt; 24) return false;
  if (!/[A-Z]/i.test(t) || !/\d/.test(t)) return false;
  if (/^\d+(?:\.\d+)?$/.test(t)) return false;
  if (isDateLike(t)) return false;
  if (/^\d{8}-\d{5}$/.test(t)) return false;
  if (/^5635-S-/i.test(t)) return false;
  if (/^0B\d+/i.test(t)) return false;
  if (/^RH\d/i.test(t)) return false;
  if (/^(TH|EA|EACH|PALLET|PACKAGE|QTY|KG|CM)$/i.test(t)) return false;
  return true;
}

function extractCandidateCodes(text) {
  if (!text) return [];
  const normalized = normalizeSpaces(text)
    .replace(/\bNet Weight\b/ig, &#x27; &#x27;)
    .replace(/\bPackage Count\b/ig, &#x27; &#x27;)
    .replace(/\bCustoms Description\b/ig, &#x27; &#x27;)
    .replace(/\bMarks\s*&amp;\s*Pallet ID\s*\/\s*Package ID\b/ig, &#x27; &#x27;)
    .replace(/\bLine\b/ig, &#x27; &#x27;)
    .replace(/\bCOO\b/ig, &#x27; &#x27;)
    .replace(/\bDN\s*#\b/ig, &#x27; &#x27;)
    .replace(/\bQty\b/ig, &#x27; &#x27;)
    .replace(/\bQTY:\s*[\d,]+/ig, &#x27; &#x27;)
    .replace(/\bScheduled Ship Date\b/ig, &#x27; &#x27;)
    .replace(/\bInvoice Date\b/ig, &#x27; &#x27;)
    .replace(/\b\d+(?:\.\d{2,})\b/g, &#x27; &#x27;);
  const raw = normalized.split(/[\s,;|]+/).map(cleanToken).filter(Boolean);
  const ids = [];
  raw.forEach(token =&gt; {
    if (isLikelyPalletCode(token) &amp;&amp; !ids.includes(token)) ids.push(token);
  });
  return ids;
}

function parseSingleShipmentByColumns(items) {
  let colX = null, colY = null;
  for (const item of items) {
    if (item.str.includes(&#x27;Marks&#x27;) &amp;&amp; (item.str.includes(&#x27;Package ID&#x27;) || item.str.includes(&#x27;Pallet ID&#x27;))) {
      colX = item.x; colY = item.y; break;
    }
  }
  if (colX === null) return [];
  let nextColX = colX + 260;
  for (const item of items) {
    if (/^(Qty|QTY)$/i.test(normalizeSpaces(item.str)) &amp;&amp; Math.abs(item.y - colY) &lt; 40 &amp;&amp; item.x &gt; colX) {
      nextColX = item.x; break;
    }
  }
  let stopY = Infinity;
  for (const item of items) {
    if ((item.str.includes(&#x27;Total Value&#x27;) || item.str.includes(&#x27;Total Net Weight&#x27;) || item.str === &#x27;NOTE:&#x27; || item.str === &#x27;NOTE&#x27;) &amp;&amp; item.y &gt; colY) {
      stopY = Math.min(stopY, item.y);
    }
  }
  const colItems = items.filter(item =&gt; item.y &gt; colY + 6 &amp;&amp; item.y &lt; stopY &amp;&amp; item.x &gt;= colX - 15 &amp;&amp; item.x &lt;= nextColX)
    .sort((a, b) =&gt; a.y - b.y || a.x - b.x);
  return extractCandidateCodes(colItems.map(item =&gt; item.str).join(&#x27; &#x27;));
}

function parseShipmentByHeaderBlocks(items) {
  const headerRegex = /Marks\s*&amp;\s*Pallet ID\s*\/\s*Package ID/i;
  const stopRegex = /(Total Value|NOTE:|Total Net Weight|Phone Shipment Number|Delivery Order and Packing List Page|EXPORT NOTICE|CERTIFIED TRUE)/i;
  const blocks = [];
  let collecting = false;
  let buffer = [];
  const flush = () =&gt; { if (buffer.length) { blocks.push(buffer.join(&#x27; &#x27;)); buffer = []; } };
  groupItemsIntoLines(items).forEach(line =&gt; {
    const text = normalizeSpaces(line.text);
    if (!text) return;
    if (headerRegex.test(text)) {
      if (collecting) flush();
      collecting = true;
      const afterHeader = text.replace(headerRegex, &#x27;&#x27;).trim();
      if (afterHeader) buffer.push(afterHeader);
      return;
    }
    if (collecting) {
      if (stopRegex.test(text)) { flush(); collecting = false; return; }
      buffer.push(text);
    }
  });
  flush();
  const ids = [];
  blocks.forEach(block =&gt; extractCandidateCodes(block).forEach(code =&gt; { if (!ids.includes(code)) ids.push(code); }));
  return ids;
}

function parseShipmentByQtyFallback(items) {
  const ids = [];
  groupItemsIntoLines(items).forEach(line =&gt; {
    if (!/QTY:/i.test(line.text)) return;
    extractCandidateCodes(line.text).forEach(code =&gt; { if (!ids.includes(code)) ids.push(code); });
  });
  return ids;
}

function parseShipmentByGlobalText(items) {
  const fullText = normalizeSpaces(groupItemsIntoLines(items).map(line =&gt; line.text).join(&#x27; &#x27;));
  const match = fullText.match(/Marks\s*&amp;\s*Pallet ID\s*\/\s*Package ID(.*?)(?:Total Value|NOTE:|Total Net Weight|Phone Shipment Number|$)/i);
  return match ? extractCandidateCodes(match[1] || &#x27;&#x27;) : [];
}

function parseSingleShipment(items, shipmentNum) {
  const ids = [];
  [parseSingleShipmentByColumns(items), parseShipmentByHeaderBlocks(items), parseShipmentByQtyFallback(items), parseShipmentByGlobalText(items)]
    .forEach(list =&gt; list.forEach(code =&gt; { if (!ids.includes(code)) ids.push(code); }));
  return ids.length ? ids.map(code =&gt; ({ shipment: shipmentNum, palletId: code })) : [{ shipment: shipmentNum, palletId: &#x27;-&#x27; }];
}

function parseData(items) {
  const shipmentAnchors = extractShipmentNumbers(items);
  if (shipmentAnchors.length === 0) return [{ shipment: &#x27;-&#x27;, palletId: &#x27;-&#x27; }];
  if (shipmentAnchors.length === 1) return parseSingleShipment(items, shipmentAnchors[0].num);
  const allResults = [];
  for (let i = 0; i &lt; shipmentAnchors.length; i++) {
    const startY = shipmentAnchors[i].y - 220;
    const endY = i + 1 &lt; shipmentAnchors.length ? shipmentAnchors[i + 1].y - 180 : Infinity;
    const segment = items.filter(item =&gt; item.y &gt;= startY &amp;&amp; item.y &lt; endY);
    allResults.push(...parseSingleShipment(segment, shipmentAnchors[i].num));
  }
  return allResults;
}

async function extractAll() {
  results = [];
  status.textContent = &#x27;กำลังดึงข้อมูล...&#x27;;
  extractBtn.disabled = true;
  document.getElementById(&#x27;results-section&#x27;).style.display = &#x27;none&#x27;;
  for (let i = 0; i &lt; files.length; i++) {
    status.textContent = `กำลังอ่านไฟล์ ${i + 1}/${files.length}: ${files[i].name}`;
    try {
      const items = await extractItemsFromPDF(files[i]);
      results.push(...parseData(items));
    } catch (e) {
      results.push({ shipment: &#x27;Error&#x27;, palletId: e.message });
    }
  }
  renderResults();
  extractBtn.disabled = false;
  status.textContent = `เสร็จสิ้น — พบข้อมูล ${results.length} แถว`;
}

function renderResults() {
  const tbody = document.getElementById(&#x27;results-body&#x27;);
  tbody.innerHTML = &#x27;&#x27;;
  results.forEach((r, idx) =&gt; {
    const tr = document.createElement(&#x27;tr&#x27;);
    const isFirst = idx === 0 || results[idx - 1].shipment !== r.shipment;
    tr.className = isFirst ? &#x27;group-first&#x27; : &#x27;group-cont&#x27;;
    tr.innerHTML = `&lt;td&gt;${r.shipment}&lt;/td&gt;&lt;td&gt;${r.palletId}&lt;/td&gt;`;
    tbody.appendChild(tr);
  });
  document.getElementById(&#x27;row-count&#x27;).textContent = `${results.length} รายการ`;
  document.getElementById(&#x27;results-section&#x27;).style.display = &#x27;block&#x27;;
  exportBtn.disabled = results.length === 0;
}

function getDatePrefix() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, &#x27;0&#x27;);
  const d = String(now.getDate()).padStart(2, &#x27;0&#x27;);
  return `${y}${m}${d} - T.`;
}
function openExportModal() {
  document.getElementById(&#x27;filename-prefix&#x27;).textContent = getDatePrefix();
  document.getElementById(&#x27;filename-suffix&#x27;).value = &#x27;&#x27;;
  document.getElementById(&#x27;export-modal&#x27;).classList.add(&#x27;open&#x27;);
  setTimeout(() =&gt; document.getElementById(&#x27;filename-suffix&#x27;).focus(), 50);
}
function closeModal() { document.getElementById(&#x27;export-modal&#x27;).classList.remove(&#x27;open&#x27;); }
document.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; {
  document.getElementById(&#x27;filename-suffix&#x27;).addEventListener(&#x27;keydown&#x27;, e =&gt; {
    if (e.key === &#x27;Enter&#x27;) confirmExport();
    if (e.key === &#x27;Escape&#x27;) closeModal();
  });
  document.getElementById(&#x27;export-modal&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {
    if (e.target === document.getElementById(&#x27;export-modal&#x27;)) closeModal();
  });
});
function confirmExport() {
  const prefix = document.getElementById(&#x27;filename-prefix&#x27;).textContent;

  const filename = prefix + suffix + &#x27;.xlsx&#x27;;
  closeModal();

}
function doExport(filename) {
  const header = [&#x27;Shipment Number / Shipping Mark&#x27;, &#x27;Marks &amp; Pallet ID / Package ID&#x27;];
  const rows = results.map(r =&gt; [r.shipment, r.palletId]);
  const col1Texts = [header[0], ...rows.map(r =&gt; r[0])];
  const col2Texts = [header[1], ...rows.map(r =&gt; r[1])];
  const col1Width = Math.max(...col1Texts.map(s =&gt; String(s).length)) + 2;
  const col2Width = Math.max(...col2Texts.map(s =&gt; String(s).length)) + 2;
  const wsData = [header, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws[&#x27;!cols&#x27;] = [{ wch: col1Width }, { wch: col2Width }];
  const headerStyle = { font: { bold: true }, fill: { fgColor: { rgb: &#x27;F5F5F5&#x27; } } };
  [&#x27;A1&#x27;, &#x27;B1&#x27;].forEach(cell =&gt; { if (ws[cell]) ws[cell].s = headerStyle; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, &#x27;Packing List&#x27;);
  XLSX.writeFile(wb, filename);
}

async function extractItems(file){
  const ab=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:ab}).promise;
  const allItems=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:1});
    const H=vp.height;
    const content=await page.getTextContent();
    content.items.forEach(item=>{
      if(!item.str.trim())return;
      // PDF coordinates: origin bottom-left, Y increases upward

        str:item.str.trim(),

        y:parseFloat(item.transform[5].toFixed(1))  // raw PDF Y, higher = higher on page

function parsePL(items,filename){

  // GROSS WGT  x=301.3, y=93.4 (label, TOTAL section)

  // NET WGT    x=321.3, y=107.4(label, TOTAL section)

    const nwLabel=items.find(i=>i.str===&#39;NET WGT&#39;&amp;&amp;i.y<200);
    if(nwLabel){
      const nVal=items.find(i=>Math.abs(i.y-nwLabel.y)<=5&amp;&amp;i.x>nwLabel.x&amp;&amp;/^[\d.]+kg$/i.test(i.str));
      if(nVal)net=parseFloat(nVal.str);
    }
  }

  return{pl,remark,gross,net,filename};
}

async function extractAll(){
  if(files.length===0)return;
  results=[];
  
  document.getElementById(&#39;results-block&#39;).style.display=&#39;none&#39;;
  document.getElementById(&#39;progress-wrap&#39;).style.display=&#39;block&#39;;
  document.getElementById(&#39;progress-bar&#39;).style.width=&#39;0%&#39;;

  for(let i=0;i<files.length;i++){
    document.getElementById(&#39;status&#39;).textContent=&#39;กำลังอ่าน &#39;+(i+1)+&#39;/&#39;+files.length+&#39;: &#39;+files[i].name;
    document.getElementById(&#39;progress-bar&#39;).style.width=((i/files.length)*100)+&#39;%&#39;;
    try{
      const items=await extractItems(files[i]);
      lastItems=items;
      results.push(parsePL(items,files[i].name));
    }catch(e){
      console.error(e);
      results.push({pl:&#39;Error&#39;,remark:e.message,gross:null,net:null,filename:files[i].name});
    }
  }
  document.getElementById(&#39;progress-bar&#39;).style.width=&#39;100%&#39;;
  document.getElementById(&#39;status&#39;).textContent=&#39;เสร็จ — พบข้อมูล &#39;+results.length+&#39; ไฟล์&#39;;
  
  renderResults();
}

function renderResults(){
  const tbody=document.getElementById(&#39;results-body&#39;);
  tbody.innerHTML=&#39;&#39;;
  let tg=0,tn=0;
  results.forEach((r,i)=>{
    const tr=document.createElement(&#39;tr&#39;);
    const g=r.gross!==null?r.gross.toFixed(1):null;
    const n=r.net!==null?r.net.toFixed(2):null;
    tr.innerHTML=
      &#39;<td class=&quot;no&quot;>&#39;+(i+1)+&#39;</td>&#39;+
      &#39;<td class=&quot;fname&quot; title=&quot;&#39;+r.filename+&#39;&quot;>&#39;+r.filename+&#39;</td>&#39;+
      &#39;<td class=&quot;pl&quot;>&#39;+r.pl+&#39;</td>&#39;+
      &#39;<td class=&quot;rem&quot;>&#39;+r.remark+&#39;</td>&#39;+
      &#39;<td class=&quot;&#39;+(g?&#39;num&#39;:&#39;miss&#39;)+&#39;&quot;>&#39;+(g||&#39;-&#39;)+&#39;</td>&#39;+
      &#39;<td class=&quot;&#39;+(n?&#39;num&#39;:&#39;miss&#39;)+&#39;&quot;>&#39;+(n||&#39;-&#39;)+&#39;</td>&#39;;
    tbody.appendChild(tr);
    if(r.gross)tg+=r.gross;
    if(r.net)tn+=r.net;
  });
  document.getElementById(&#39;total-gross&#39;).textContent=tg.toFixed(2);
  document.getElementById(&#39;total-net&#39;).textContent=tn.toFixed(2);
  document.getElementById(&#39;results-block&#39;).style.display=&#39;block&#39;;
}
</script>

  <script>
    const buttons = Array.from(document.querySelectorAll('.tab-btn'));
    const panels = Array.from(document.querySelectorAll('.panel'));
    function activate(targetId) {
      buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.target === targetId));
      panels.forEach(panel => panel.classList.toggle('active', panel.id === targetId));
    }
    buttons.forEach(btn => btn.addEventListener('click', () => activate(btn.dataset.target)));
