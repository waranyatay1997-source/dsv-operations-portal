  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; font-family: Tahoma, Arial, sans-serif; background:#f5f7fb; color:#1f2937; }
    .app { display:grid; grid-template-rows:auto 1fr; height:100vh; }

    iframe { width:100%; height:100%; border:0; background:#fff; }

      .topbar { align-items:flex-start; flex-direction:column; }

      color: var(--text);

      padding: 16px;

    .panel {

    .data-grid-wrap {

    }

    .data-grid {

      border-collapse: collapse;
      table-layout: fixed;
      font-size: 14px;

    .data-grid col.no-col { width: 12%; }
    .data-grid col.hbl-col { width: 38%; }
    .data-grid col.sid-col { width: 38%; }
    .data-grid col.qty-col { width: 12%; }

    .data-grid th,
    .data-grid td {
      border: 1px solid var(--line-dark);
      padding: 8px 10px;
      text-align: left;
      vertical-align: middle;
      min-height: 42px;
      height: 42px;
      background: #fff;
    }

    .data-grid thead th {
      background: #eef3f8;
      font-weight: 700;

      top: 0;
      z-index: 1;
    }

    }

    .data-cell:focus {
      background: #fffdf2;
      box-shadow: inset 0 0 0 2px #f0c85a;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .summary strong { font-size: 18px; }
    .summary .muted { margin: 0; }

    .pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;

    .page {
      width: var(--page-width);
      min-height: var(--page-height);
      background: white;

      border: 1px solid #ddd;
      display: grid;

      overflow: hidden;

      display: flex;
      flex-direction: column;
      border-bottom: 1px solid #8f8f8f;

    .label-top { display: flex; flex-direction: column; }

    .label-value.hbl { margin-top: var(--hbl-title-to-value-gap); }
    .label-counter {

      align-items: baseline;
      justify-content: center;
      gap: 10mm;
      margin-top: auto;
      transform: translateY(calc(-1 * var(--counter-lift)));

    .label-counter .counter-num { font-size: var(--label-counter-size); font-weight: 700; line-height: .95; }
    .label-counter .counter-of { font-size: var(--counter-of-size); font-weight: 700; line-height: 1; }

    @media (max-width: 1250px) {

      .panel { position: static; height: auto; }
    }

    @media print {
      body { background: white; }

      .app { display: block; padding: 0; }
      .workspace { padding: 0; border: 0; box-shadow: none; }
      .summary { display: none !important; }
      .pages { gap: 0; }
      .page { margin: 0; border: 0; box-shadow: none; page-break-after: always; }
      @page { size: A4 portrait; margin: 0; }
    }

    function clearTable() {
      $(&#x27;gridBody&#x27;).querySelectorAll(&#x27;.data-cell&#x27;).forEach((cell) =&gt; { cell.textContent = &#x27;&#x27;; });

    function readRows() {

    function validateRows(rows) {
      if (!rows.length) return { ok: false };
      for (const row of rows) {
        if (!row.hbl || !row.sid || !Number.isFinite(Number(row.qty)) || Number(row.qty) &lt;= 0) {

      return { ok: true };

    function createLabel(row, index) {
      return `&lt;section class=&quot;label&quot;&gt;&lt;div class=&quot;label-stack&quot;&gt;&lt;div class=&quot;label-top&quot;&gt;&lt;div class=&quot;label-header&quot;&gt;${escapeHtml(fixedHeader)}&lt;/div&gt;&lt;div class=&quot;label-title&quot;&gt;Shipment Number / Shipping Mark :&lt;/div&gt;&lt;div class=&quot;label-value sid&quot;&gt;${escapeHtml(row.sid)}&lt;/div&gt;&lt;div class=&quot;label-title hbl-title&quot;&gt;House Bill Of Lading :&lt;/div&gt;&lt;div class=&quot;label-value hbl&quot;&gt;${escapeHtml(row.hbl)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;label-counter&quot;&gt;&lt;span class=&quot;counter-num&quot;&gt;${index}&lt;/span&gt;&lt;span class=&quot;counter-of&quot;&gt;OF&lt;/span&gt;&lt;span class=&quot;counter-num&quot;&gt;${row.qty}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`;
    }

    function generateLabels() {
      const rows = readRows();
      const check = validateRows(rows);
      if (!check.ok) {
        $(&#x27;pages&#x27;).innerHTML = &#x27;&#x27;;
        $(&#x27;summaryText&#x27;).textContent = &#x27;ยังไม่ได้ generate&#x27;;
        return;

      const labels = [];
      rows.forEach((row) =&gt; {
        for (let i = 1; i &lt;= row.qty; i++) labels.push(createLabel(row, i));
      });
      const pages = [];
      for (let i = 0; i &lt; labels.length; i += 2) {
        pages.push(`&lt;div class=&quot;page&quot;&gt;${labels[i] || &#x27;&lt;section class=&quot;label&quot;&gt;&lt;/section&gt;&#x27;}${labels[i + 1] || &#x27;&lt;section class=&quot;label&quot;&gt;&lt;/section&gt;&#x27;}&lt;/div&gt;`);
      }
      $(&#x27;pages&#x27;).innerHTML = pages.join(&#x27;&#x27;);
      $(&#x27;summaryText&#x27;).textContent = `ข้อมูล ${rows.length} แถว · label ${labels.length} ป้าย · ${pages.length} หน้า`;
    }

    function printLabels() {
      generateLabels();
      const previousTitle = document.title;
      document.title = &#x27;Shipping mark T.&#x27;;
      setTimeout(() =&gt; {
        window.print();
        setTimeout(() =&gt; { document.title = previousTitle; }, 800);
      }, 100);
    }

    $(&#x27;btnClear&#x27;).addEventListener(&#x27;click&#x27;, clearTable);
    $(&#x27;btnGenerateTop&#x27;).addEventListener(&#x27;click&#x27;, generateLabels);
    $(&#x27;btnPrintTop&#x27;).addEventListener(&#x27;click&#x27;, printLabels);

    bindGridEvents();
  &lt;/script&gt;

function parseSingleShipmentLegacy(items,shipmentNum){let colX=null,colY=null;for(const item of items){if(item.str.includes(&#x27;Marks&#x27;)||item.str.includes(&#x27;Package ID&#x27;)){colX=item.x;colY=item.y;break}} if(colX===null)return[{shipment:shipmentNum,palletId:&#x27;-&#x27;}]; let nextColX=colX+130;for(const item of items){if((item.str===&#x27;Qty&#x27;||item.str===&#x27;QTY&#x27;)&amp;&amp;item.y&lt;colY+40){nextColX=item.x;break}} let stopY=Infinity;for(const item of items){if((item.str.includes(&#x27;Total Value&#x27;)||item.str===&#x27;NOTE:&#x27;||item.str===&#x27;NOTE&#x27;)&amp;&amp;item.y&gt;colY){if(item.y&lt;stopY)stopY=item.y}} const colItems=items.filter(item=&gt;{if(item.y&lt;=colY+10)return false;if(item.y&gt;=stopY)return false;if(item.x&lt;colX-30||item.x&gt;nextColX-5)return false;return !isNoiseStr(item.str)}).sort((a,b)=&gt;a.y-b.y); let combined=&#x27;&#x27;; for(let i=0;i&lt;colItems.length;i++)combined+=colItems[i].str; const rawIds=combined.split(&#x27;,&#x27;).map(s=&gt;s.trim()).filter(s=&gt;s.length&gt;=3); const filtered=rawIds.filter(s=&gt;{if(/^\d+$/.test(s))return false;if(/^(TH|QTY|COO)$/i.test(s))return false;if(/^(Package ID|Pallet ID|Package|Pallet|Marks|ID)$/i.test(s))return false;if(s.length&lt;5)return false;return true}); const uniqueIds=[...new Set(filtered)]; if(uniqueIds.length===0)return[{shipment:shipmentNum,palletId:&#x27;-&#x27;}]; return uniqueIds.map(id=&gt;({shipment:shipmentNum,palletId:id}))}
function parseLegacyByPosition(items){const shipmentPattern=/^\d{8}-\d{5}$/;const allShipmentItems=items.filter(it=&gt;shipmentPattern.test((it.str||&#x27;&#x27;).trim()));const seenNums=new Map();for(const it of allShipmentItems){const num=it.str.trim();if(!seenNums.has(num)||it.y&lt;seenNums.get(num))seenNums.set(num,it.y)} const anchors=[]; for(const [num,y] of seenNums.entries())anchors.push({num,y}); anchors.sort((a,b)=&gt;a.y-b.y); if(anchors.length===0){const fullText=items.map(i=&gt;i.str).join(&#x27; &#x27;);const m=fullText.match(/(\d{8}-\d{5})/);return parseSingleShipmentLegacy(items,m?m[1]:&#x27;-&#x27;)} if(anchors.length===1)return parseSingleShipmentLegacy(items,anchors[0].num); const out=[]; for(let i=0;i&lt;anchors.length;i++){const startY=anchors[i].y-200;const endY=i+1&lt;anchors.length?anchors[i+1].y-200:Infinity;const segment=items.filter(item=&gt;item.y&gt;=startY&amp;&amp;item.y&lt;endY);out.push(...parseSingleShipmentLegacy(segment,anchors[i].num))} return out}
function extractPalletIdsModern(text){const cleaned=normalizeText(text);const ids=[];let match; const regex1=/QTY:\s*\d+\s+\d+\s+((?:[A-Z0-9]+\s*,\s*)+[A-Z0-9]+)\s*,?\s*\d+\.\d{5}/gi; while((match=regex1.exec(cleaned))!==null){match[1].split(&#x27;,&#x27;).map(x=&gt;x.trim()).forEach(token=&gt;{if(/^[A-Z0-9]{6,}$/.test(token))ids.push(token)})} if(ids.length===0){const regex2=/([A-Z0-9]{6,}(?:\s*,\s*[A-Z0-9]{6,}){2,})\s*,?\s*\d+\.\d{5}/gi; while((match=regex2.exec(cleaned))!==null){match[1].split(&#x27;,&#x27;).map(x=&gt;x.trim()).forEach(token=&gt;{if(/^[A-Z0-9]{6,}$/.test(token))ids.push(token)})}} return [...new Set(ids)]}
function parseModernByText(text){const shipment=extractShipmentNumber(text);const ids=extractPalletIdsModern(text);if(ids.length===0)return[{shipment,palletId:&#x27;-&#x27;}];return ids.map(id=&gt;({shipment,palletId:id}))}
function mergeHybrid(legacyRows,modernRows){const merged=new Map();const addRows=rows=&gt;{rows.forEach(r=&gt;{const shipment=r.shipment||&#x27;-&#x27;;const palletId=(r.palletId||&#x27;-&#x27;).trim();if(!merged.has(shipment))merged.set(shipment,new Set());if(palletId&amp;&amp;palletId!==&#x27;-&#x27;)merged.get(shipment).add(palletId)})}; addRows(legacyRows||[]);addRows(modernRows||[]);const out=[]; if(merged.size===0)return []; merged.forEach((set,shipment)=&gt;{const ids=[...set]; if(ids.length===0)out.push({shipment,palletId:&#x27;-&#x27;}); else ids.forEach(id=&gt;out.push({shipment,palletId:id}))}); return out}
async function extractAll(){results=[];status.textContent=&#x27;กำลังดึงข้อมูล...&#x27;;extractBtn.disabled=true;$(&#x27;results-section&#x27;).style.display=&#x27;none&#x27;;for(let i=0;i&lt;files.length;i++){status.textContent=`กำลังอ่านไฟล์ ${i+1}/${files.length}: ${files[i].name}`;try{const payload=await extractItemsAndText(files[i]);const legacyRows=parseLegacyByPosition(payload.items);const modernRows=parseModernByText(payload.text);const hybridRows=mergeHybrid(legacyRows,modernRows);if(hybridRows.length===0){const shipment=extractShipmentNumber(payload.text);results.push({shipment,palletId:&#x27;-&#x27;})}else{results.push(...hybridRows)}}catch(e){results.push({shipment:&#x27;Error&#x27;,palletId:e.message})}}renderResults();extractBtn.disabled=false;status.textContent=`เสร็จสิ้น — พบข้อมูล ${results.length} แถว`}
function renderResults(){const tbody=$(&#x27;results-body&#x27;);tbody.innerHTML=&#x27;&#x27;;results.forEach((r,idx)=&gt;{const tr=document.createElement(&#x27;tr&#x27;);const isFirst=idx===0||results[idx-1].shipment!==r.shipment;tr.className=isFirst?&#x27;group-first&#x27;:&#x27;group-cont&#x27;;tr.innerHTML=`&lt;td&gt;${r.shipment}&lt;/td&gt;&lt;td&gt;${r.palletId}&lt;/td&gt;`;tbody.appendChild(tr)});$(&#x27;row-count&#x27;).textContent=`${results.length} รายการ`; $(&#x27;results-section&#x27;).style.display=&#x27;block&#x27;;exportBtn.disabled=results.length===0}
function getDatePrefix(){const now=new Date();const y=now.getFullYear();const m=String(now.getMonth()+1).padStart(2,&#x27;0&#x27;);const d=String(now.getDate()).padStart(2,&#x27;0&#x27;);return `${y}${m}${d} - T.`} function openExportModal(){$(&#x27;filename-prefix&#x27;).textContent=getDatePrefix();$(&#x27;filename-suffix&#x27;).value=&#x27;&#x27;;$(&#x27;export-modal&#x27;).classList.add(&#x27;open&#x27;);setTimeout(()=&gt;$(&#x27;filename-suffix&#x27;).focus(),50)} function closeModal(){$(&#x27;export-modal&#x27;).classList.remove(&#x27;open&#x27;)}
