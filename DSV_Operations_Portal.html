<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSV Operations Portal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; font-family: Tahoma, Arial, sans-serif; background:#f5f7fb; color:#1f2937; }
    .app { display:grid; grid-template-rows:auto 1fr; height:100vh; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 18px; background:#ffffff; border-bottom:1px solid #dbe3f0; }
    .title-wrap h1 { margin:0; font-size:24px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; }
    .tab-btn { border:1px solid #cfe0f1; background:#eef4fb; color:#103a5c; border-radius:12px; padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer; }
    .tab-btn.active { background:#005a9c; color:#ffffff; border-color:#005a9c; }
    .content { min-height:0; }
    .panel { display:none; height:100%; }
    .panel.active { display:block; }
    iframe { width:100%; height:100%; border:0; background:#fff; }
    @media (max-width: 900px) { .topbar { align-items:flex-start; flex-direction:column; } .tabs { width:100%; } .tab-btn { flex:1 1 auto; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="title-wrap"><h1>DSV Operations Portal</h1></div><nav class="tabs" aria-label="เลือกเครื่องมือ"><button class="tab-btn active" data-target="shipping-panel">Shipping Mark Label Generator</button><button class="tab-btn" data-target="packing-panel">WD Packing List Extractor (Hybrid v4)</button></nav></header>
    <main class="content"><section id="shipping-panel" class="panel active"><iframe title="Shipping Mark Label Generator" src="DSV_Shipping_Mark_Label_Generator.html"></iframe></section><section id="packing-panel" class="panel"><iframe title="WD Packing List Extractor Hybrid v4" src="WD_PackingList_Extractor_Hybrid.html"></iframe></section></main>
  </div>
  <script>
    const buttons = Array.from(document.querySelectorAll('.tab-btn'));
    const panels = Array.from(document.querySelectorAll('.panel'));
    function activate(targetId) {
      buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.target === targetId));
      panels.forEach(panel => panel.classList.toggle('active', panel.id === targetId));
    }
    buttons.forEach(btn => btn.addEventListener('click', () => activate(btn.dataset.target)));
  </script>
</body>
</html>
